<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌊 Limpe o Oceano</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>🌊 Limpe o Oceano!</h1>

    <p>
        Ajude a retirar o lixo do mar e proteja os animais!
    </p>

</header>


<main>

    <div class="painel">

        <div class="pontuacao">

            <div>
                ♻️ Pontos:
                <span id="pontos">0</span>
            </div>

            <div>
                ⏱️ Tempo:
                <span id="tempo">30</span>
            </div>

            <div>
                🗑️ Lixos:
                <span id="quantidade">12</span>
            </div>

        </div>


        <div id="oceano">

            <div class="onda"></div>

            <div class="peixe peixe1">
                
            </div>

            <div class="peixe peixe2">
                
            </div>

            <div class="peixe tartaruga">
                
            </div>

            <div class="areia"></div>

        </div>


        <div id="mensagem">
            Clique em "Começar" para jogar!
        </div>


        <button id="botaoComecar">
            ▶️ Começar / Reiniciar
        </button>

    </div>

</main>


<footer>

    
</footer>
